set -g extended-keys on
set -g extended-keys-format csi-u

# Scroll through terminal history with the mouse/trackpad.
set -g mouse on
set -g history-limit 50000

set -g cursor-style default

# Subtly dim inactive panes while keeping the active pane unchanged.
set -g window-style 'fg=colour250,bg=colour234'
set -g window-active-style 'fg=terminal,bg=terminal,none'
